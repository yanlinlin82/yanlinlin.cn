<!DOCTYPE html>
<html lang="zh-CN">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  <div class="container">
    {{- partial "header.html" . -}}

    <main class="main-content-geek">
      {{ block "main" . }}{{ end }}
    </main>

    {{- partial "footer.html" . -}}
  </div>

  {{- partial "search-index-generator.html" . -}}
  {{- partial "search.html" . -}}

  <!-- 返回顶部按钮 -->
  <button id="backToTop" class="btn-back-to-top" aria-label="返回顶部" title="返回顶部">
    <i class="fas fa-arrow-up"></i>
  </button>

  {{ if .Params.math }}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      renderMathInElement(document.body, {
        delimiters: [
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ]
      });
    });
  </script>
  {{ end }}

  <script src="{{ "assets/js/main.js" | relURL }}"></script>
  <script src="{{ "assets/js/thumbnails.js" | relURL }}"></script>

  <!-- 网站分析工具 -->
  {{ partial "analytics.html" . }}
</body>
</html>
