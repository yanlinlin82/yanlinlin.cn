{{- $lang := .Type | default "text" -}}
{{- $count := len (split (trim .Inner "\n") "\n") -}}
{{- $html := transform.Highlight .Inner $lang .Options -}}
<div class="code-block" data-lang="{{ $lang }}">
  <div class="code-toolbar">
    <span class="code-lang">{{ $lang }}</span>
    <span class="code-actions">
      <button
        class="code-wrap-toggle"
        type="button"
        aria-pressed="false"
        aria-label="切换折行"
        title="切换折行"
      >
        <i class="fas fa-align-left" aria-hidden="true"></i>
        <span class="code-wrap-text">折行</span>
      </button>
      <button
        class="code-copy"
        type="button"
        aria-label="复制代码"
        data-label-copy="复制"
        data-label-done="已复制"
        data-label-fail="复制失败"
      >
        <i class="fas fa-copy" aria-hidden="true"></i>
        <span class="code-copy-text">复制</span>
      </button>
    </span>
  </div>
  {{ $html }}
  <div class="code-footer">
    <span class="code-lines">共 {{ $count }} 行</span>
  </div>
  <template class="code-source">{{ .Inner }}</template>
</div>
