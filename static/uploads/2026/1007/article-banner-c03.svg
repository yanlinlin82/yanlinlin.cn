<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b18"/>
      <stop offset="0.5" stop-color="#0f1a33"/>
      <stop offset="1" stop-color="#070c17"/>
    </linearGradient>

    <radialGradient id="ambient" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#4338ca" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4338ca" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#04070d" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#04070d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#04070d" stop-opacity="0.72"/>
    </radialGradient>

    <linearGradient id="leftGrad" gradientUnits="userSpaceOnUse" x1="352" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="rightGrad" gradientUnits="userSpaceOnUse" x1="680" y1="0" x2="848" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="axisGrad" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="420">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 L 0 48" fill="none" stroke="#2a3f66" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>
  <g opacity="0.18">
    <rect width="1200" height="500" fill="url(#grid)"/>
  </g>
  <rect width="1200" height="500" fill="url(#ambient)"/>

  <!-- 平衡的记账刻度：左借右贷，两两等高 -->
  <g stroke="url(#leftGrad)" stroke-width="8" stroke-linecap="round">
    <line x1="470" y1="110" x2="520" y2="110" opacity="0.85"/>
    <line x1="435" y1="145" x2="520" y2="145" opacity="0.85"/>
    <line x1="400" y1="180" x2="520" y2="180" opacity="0.9"/>
    <line x1="370" y1="215" x2="520" y2="215" opacity="0.9"/>
    <line x1="352" y1="250" x2="520" y2="250" opacity="1"/>
    <line x1="370" y1="285" x2="520" y2="285" opacity="0.9"/>
    <line x1="400" y1="320" x2="520" y2="320" opacity="0.9"/>
    <line x1="435" y1="355" x2="520" y2="355" opacity="0.85"/>
    <line x1="470" y1="390" x2="520" y2="390" opacity="0.85"/>
  </g>
  <g stroke="url(#rightGrad)" stroke-width="8" stroke-linecap="round">
    <line x1="680" y1="110" x2="730" y2="110" opacity="0.85"/>
    <line x1="680" y1="145" x2="765" y2="145" opacity="0.85"/>
    <line x1="680" y1="180" x2="800" y2="180" opacity="0.9"/>
    <line x1="680" y1="215" x2="830" y2="215" opacity="0.9"/>
    <line x1="680" y1="250" x2="848" y2="250" opacity="1"/>
    <line x1="680" y1="285" x2="830" y2="285" opacity="0.9"/>
    <line x1="680" y1="320" x2="800" y2="320" opacity="0.9"/>
    <line x1="680" y1="355" x2="765" y2="355" opacity="0.85"/>
    <line x1="680" y1="390" x2="730" y2="390" opacity="0.85"/>
  </g>

  <!-- 中轴：账平的核心 -->
  <circle cx="600" cy="250" r="150" fill="url(#core)"/>
  <line x1="600" y1="80" x2="600" y2="420" stroke="url(#axisGrad)" stroke-width="3" opacity="0.9"/>
  <circle cx="600" cy="250" r="13" fill="none" stroke="#f59e0b" stroke-width="3" filter="url(#glow)"/>
  <circle cx="600" cy="250" r="4" fill="#f59e0b"/>

  <rect width="1200" height="500" fill="url(#vignette)"/>
  <path d="M 56,116 L 56,56 L 116,56" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 1144,384 L 1144,444 L 1084,444" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
