<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- 背景与网格 -->
  <rect width="1200" height="500" fill="url(#bgGrad)"/>
  <g stroke="#94a3b8" stroke-opacity="0.05" stroke-width="1">
    <line x1="60"  y1="0" x2="60"  y2="500"/>
    <line x1="120" y1="0" x2="120" y2="500"/>
    <line x1="180" y1="0" x2="180" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="360" y1="0" x2="360" y2="500"/>
    <line x1="420" y1="0" x2="420" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="540" y1="0" x2="540" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="660" y1="0" x2="660" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
    <line x1="780" y1="0" x2="780" y2="500"/>
    <line x1="840" y1="0" x2="840" y2="500"/>
    <line x1="900" y1="0" x2="900" y2="500"/>
    <line x1="960" y1="0" x2="960" y2="500"/>
    <line x1="1020" y1="0" x2="1020" y2="500"/>
    <line x1="1080" y1="0" x2="1080" y2="500"/>
    <line x1="1140" y1="0" x2="1140" y2="500"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- 光晕（中央 + 左右两侧） -->
  <circle cx="600" cy="260" r="280" fill="#f59e0b" opacity="0.05"/>
  <circle cx="220" cy="250" r="200" fill="#ea580c" opacity="0.04"/>
  <circle cx="980" cy="250" r="200" fill="#ea580c" opacity="0.04"/>

  <!-- 左右两侧的大圆环（整幅视图的装饰，方形裁剪时基本被裁掉） -->
  <g fill="none">
    <circle cx="270" cy="260" r="160" stroke="#475569" stroke-width="2" opacity="0.28"/>
    <circle cx="250" cy="260" r="205" stroke="#475569" stroke-width="2" opacity="0.12"/>
    <circle cx="930" cy="260" r="160" stroke="#475569" stroke-width="2" opacity="0.28"/>
    <circle cx="950" cy="260" r="205" stroke="#475569" stroke-width="2" opacity="0.12"/>
  </g>

  <!-- 散落数据点（铺满整幅，左右两侧加密） -->
  <g>
    <circle cx="60"   cy="120" r="4" fill="#ea580c" opacity="0.5"/>
    <circle cx="180"  cy="90"  r="3" fill="#94a3b8" opacity="0.4"/>
    <circle cx="120"  cy="300" r="3" fill="#94a3b8" opacity="0.4"/>
    <circle cx="240"  cy="420" r="4" fill="#ea580c" opacity="0.45"/>
    <circle cx="80"   cy="430" r="3" fill="#94a3b8" opacity="0.35"/>
    <circle cx="310"  cy="180" r="3" fill="#94a3b8" opacity="0.35"/>
    <circle cx="150"  cy="220" r="3" fill="#94a3b8" opacity="0.35"/>
    <circle cx="470"  cy="60"  r="3" fill="#94a3b8" opacity="0.4"/>
    <circle cx="700"  cy="470" r="3" fill="#94a3b8" opacity="0.35"/>
    <circle cx="580"  cy="460" r="3" fill="#94a3b8" opacity="0.35"/>
    <circle cx="930"  cy="120" r="4" fill="#ea580c" opacity="0.5"/>
    <circle cx="1050" cy="300" r="3" fill="#94a3b8" opacity="0.4"/>
    <circle cx="990"  cy="90"  r="3" fill="#94a3b8" opacity="0.4"/>
    <circle cx="1120" cy="420" r="4" fill="#ea580c" opacity="0.45"/>
    <circle cx="1140" cy="180" r="3" fill="#94a3b8" opacity="0.35"/>
    <circle cx="880"  cy="430" r="3" fill="#94a3b8" opacity="0.35"/>
    <circle cx="1080" cy="220" r="3" fill="#94a3b8" opacity="0.35"/>
  </g>

  <!-- ============ 前景（全部位于中央方形区域 x≈390-830, y≈45-450） ============ -->

  <!-- 问号（批判性阅读） -->
  <text x="392" y="105" font-size="52" font-weight="bold" fill="#fbbf24" opacity="0.9" transform="rotate(-8 392 105)">？</text>

  <!-- 论文文档（待检） -->
  <g transform="rotate(-3 475 280)">
    <rect x="390" y="160" width="170" height="240" rx="8" fill="url(#docGrad)"/>
    <rect x="408" y="184" width="82" height="12" rx="4" fill="#475569" opacity="0.75"/>
    <g fill="#94a3b8" opacity="0.55">
      <rect x="408" y="222" width="134" height="8" rx="4"/>
      <rect x="408" y="244" width="125" height="8" rx="4"/>
      <rect x="408" y="266" width="130" height="8" rx="4"/>
      <rect x="408" y="288" width="112" height="8" rx="4"/>
      <rect x="408" y="310" width="96"  height="8" rx="4"/>
    </g>
    <!-- 被重点检查的那一行 -->
    <rect x="408" y="336" width="122" height="8" rx="4" fill="#c2410c" opacity="0.9"/>
    <circle cx="420" cy="340" r="13" fill="none" stroke="#ef4444" stroke-width="3"/>
  </g>

  <!-- 放大镜 -->
  <circle cx="478" cy="340" r="50" fill="#0f172a" opacity="0.4" stroke="#f1f5f9" stroke-width="6"/>
  <circle cx="478" cy="340" r="44" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.3"/>
  <ellipse cx="458" cy="321" rx="12" ry="7" fill="#ffffff" opacity="0.25" transform="rotate(-25 458 321)"/>
  <rect x="454" y="332" width="50" height="7" rx="3.5" fill="#fbbf24"/>
  <line x1="518" y1="380" x2="586" y2="448" stroke="#e2e8f0" stroke-width="16" stroke-linecap="round"/>
  <line x1="518" y1="380" x2="586" y2="448" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- 从文档到三关的连接线 -->
  <line x1="558" y1="358" x2="633" y2="370" stroke="#64748b" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round" opacity="0.7"/>

  <!-- 三个验证关卡（右侧，自上而下依次变亮） -->
  <g font-size="25" font-weight="bold" fill="#ffffff">
    <!-- 第三关：逻辑完备（最亮、最难） -->
    <rect x="635" y="140" width="190" height="60" rx="12" fill="url(#stepGrad)"/>
    <circle cx="672" cy="170" r="13" fill="#0f172a" opacity="0.35"/>
    <path d="M 666 170 L 672 176 L 681 163" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="698" y="180">逻辑完备</text>

    <!-- 第二关：可以复现 -->
    <rect x="635" y="240" width="190" height="60" rx="12" fill="url(#stepGrad)" opacity="0.78"/>
    <circle cx="672" cy="270" r="13" fill="#0f172a" opacity="0.35"/>
    <path d="M 666 270 L 672 276 L 681 263" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="698" y="280">可以复现</text>

    <!-- 第一关：数据真实 -->
    <rect x="635" y="340" width="190" height="60" rx="12" fill="url(#stepGrad)" opacity="0.55"/>
    <circle cx="672" cy="370" r="13" fill="#0f172a" opacity="0.35"/>
    <path d="M 666 370 L 672 376 L 681 363" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="698" y="380">数据真实</text>
  </g>

  <!-- 验证印章（自证清白，顶部中央） -->
  <g transform="rotate(8 700 90)">
    <rect x="655" y="45" width="90" height="90" rx="12" fill="#dc2626"/>
    <rect x="663" y="53" width="74" height="74" rx="8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    <path d="M 675 90 L 685 100 L 712 74" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
